  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;

    .wrapper {
      width: 720px;
      max-width: 95vw;

    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .info {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 16px;
      color: #c6d9ff;
    }
    #score {
      font-size: 24px;
      font-weight: bold;
      color: #00ffff;

    .info span { display: inline-flex; align-items: center; gap: 8px; }
    #game {
      width: 100%;
      height: auto;
      aspect-ratio: 640 / 480;

      border: 3px solid rgba(99, 200, 255, 0.6);
      background: #020b1d;
      box-shadow: inset 0 0 40px rgba(0, 126, 255, 0.14), 0 0 20px rgba(99, 200, 255, 0.3);
      display: block;
      max-width: 100%;
    }
    #respawn {
      padding: 12px 22px;

      border-radius: 999px;
      font-size: 16px;
      cursor: pointer;

      color: #fff;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;

    #respawn:hover { transform: translateY(-1px); box-shadow: 0 18px 36px rgba(14, 116, 255, 0.32); }
    #respawn:active { transform: translateY(1px); }
    #respawn.hidden { opacity: 0; pointer-events: none; }
    .note {
      color: #a2baff;
      font-size: 14px;
      margin-top: 10px;
      text-align: right;
    }
    .mobile-controls {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;

    .mobile-controls button {

      min-height: 65px;
      padding: 12px 20px;
      border: none;
      border-radius: 20px;
      background: rgba(88, 101, 242, 0.95);

      font-size: 18px;

    .mobile-controls button.shoot {
      background: linear-gradient(135deg, #f97316 0%, #f59e0b 100%);
    }
    .joystick-container {
      display: none;
      width: 120px;

    }
    .joystick-base {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(88, 101, 242, 0.3);
      border: 3px solid rgba(88, 101, 242, 0.6);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .joystick-stick {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(88, 101, 242, 0.8);
      position: absolute;
      transition: none;
    }
    @media (max-width: 600px) {

    .modal button:hover { transform: translateY(-1px); }

    @media (max-width: 600px) {
      .wrapper {

      }
      .topbar {

      #respawn {

      }
    }
  </style>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // Adapter la taille du canvas interne à la taille d'affichage
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    const scoreEl = document.getElementById("score");
    const etatEl = document.getElementById("etat");
    const respawnBtn = document.getElementById("respawn");
    const joystickContainer = document.getElementById("joystickContainer");
    const joystickBase = document.getElementById("joystickBase");
    const joystickStick = document.getElementById("joystickStick");
    const btnShoot = document.getElementById("btnShoot");
    const bgMusic = document.getElementById("bgMusic");

    let player;
    let bullets;
    let enemies;
    let particles;
    let stars;
    let score;
    let gameOver;
    let keys;
    let animationId;
    let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    let joystickActive = false;
    let joystickCenterX = 0;
    let joystickCenterY = 0;
    let musicStarted = false;

    function startMusic() {
      if (!musicStarted) {
        bgMusic.volume = 0.3;
        bgMusic.play().catch(e => console.log("Audio play failed:", e));
        musicStarted = true;
      }
    }

    function resetGame() {
      const scale = canvas.width / 640;
      player = {
        x: canvas.width / 2 - 20 * scale,
        y: canvas.height - 60 * scale,
        w: 40 * scale,
        h: 16 * scale,
        speed: 6 * scale,
        vx: 0,
        ax: 0
      };
      bullets = [];
      enemies = [];
      particles = [];
      stars = [];
      for (let i = 0; i < 100; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2 + 0.5,
          speed: Math.random() * 0.5 + 0.2,
          brightness: Math.random()
        });
      }
      score = 0;
      gameOver = false;
      keys = { left: false, right: false, shoot: false };
      etatEl.textContent = "Flèches ← → pour bouger, Espace pour tirer";
      respawnBtn.classList.add("hidden");
      scoreEl.textContent = "Score: 0";
      cancelAnimationFrame(animationId);
      loop();
    }

    function createEnemy() {
      const scale = canvas.width / 640;
      const size = 28 * scale;
      enemies.push({
        x: Math.random() * (canvas.width - size),
        y: -size,
        w: size,
        h: size,
        speed: (2 + Math.random() * 1.8) * scale,
        color: `hsl(${Math.random() * 60 + 340}, 80%, 60%)`
      });
    }

    function createParticle(x, y, color) {
      const scale = canvas.width / 640;
      for (let i = 0; i < 12; i++) {
        const angle = (Math.PI * 2 / 12) * i;
        const speed = Math.random() * 6 * scale + 2 * scale;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          color: color,
          size: Math.random() * 4 * scale + 2 * scale,
          gravity: 0.15 * scale
        });
      }
    }

    function drawRect(obj, color, glow = false) {
      if (glow) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = color;
      }
      ctx.fillStyle = color;
      ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
      ctx.shadowBlur = 0;
    }

    function drawSpaceship(x, y, w, h, color, glow = false) {
      const scale = canvas.width / 640;
      const time = Date.now() / 100;
      
      if (glow) {
        ctx.shadowBlur = 25;
        ctx.shadowColor = color;
      }
      
      // Ailes principales
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x + w / 2, y);
      ctx.lineTo(x + w * 1.3, y + h * 1.2);
      ctx.lineTo(x + w * 0.9, y + h * 0.8);
      ctx.lineTo(x + w / 2, y + h * 0.5);
      ctx.lineTo(x + w * 0.1, y + h * 0.8);
      ctx.lineTo(x - w * 0.3, y + h * 1.2);
      ctx.closePath();
      ctx.fill();
      
      // Corps principal du vaisseau
      ctx.fillStyle = '#0088cc';
      ctx.beginPath();
      ctx.moveTo(x + w / 2, y);
      ctx.lineTo(x + w * 0.7, y + h * 0.6);
      ctx.lineTo(x + w * 0.6, y + h);
      ctx.lineTo(x + w * 0.4, y + h);
      ctx.lineTo(x + w * 0.3, y + h * 0.6);
      ctx.closePath();
      ctx.fill();
      
      // Détails de coque
      ctx.strokeStyle = '#00aaff';
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      ctx.moveTo(x + w / 2, y);
      ctx.lineTo(x + w / 2, y + h * 0.6);
      ctx.stroke();
      
      // Cockpit
      ctx.fillStyle = '#00ffff';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00ffff';
      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + h * 0.35, w * 0.12, h * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // Reflet sur le cockpit
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.beginPath();
      ctx.ellipse(x + w / 2 - w * 0.03, y + h * 0.32, w * 0.04, h * 0.06, -0.3, 0, Math.PI * 2);
      ctx.fill();
      
      // Réacteurs avec flammes animées
      const flameLength = (Math.sin(time) + 1.5) * h * 0.4;
      
      // Réacteur gauche
      ctx.fillStyle = '#ff6600';
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#ff6600';
      ctx.beginPath();
      ctx.moveTo(x + w * 0.15, y + h * 0.9);
      ctx.lineTo(x + w * 0.25, y + h * 0.9);
      ctx.lineTo(x + w * 0.2, y + h * 0.9 + flameLength);
      ctx.closePath();
      ctx.fill();
      
      // Cœur de la flamme gauche
      ctx.fillStyle = '#ffff00';
      ctx.beginPath();
      ctx.moveTo(x + w * 0.17, y + h * 0.9);
      ctx.lineTo(x + w * 0.23, y + h * 0.9);
      ctx.lineTo(x + w * 0.2, y + h * 0.9 + flameLength * 0.6);
      ctx.closePath();
      ctx.fill();
      
      // Réacteur droit
      ctx.fillStyle = '#ff6600';
      ctx.beginPath();
      ctx.moveTo(x + w * 0.75, y + h * 0.9);
      ctx.lineTo(x + w * 0.85, y + h * 0.9);
      ctx.lineTo(x + w * 0.8, y + h * 0.9 + flameLength);
      ctx.closePath();
      ctx.fill();
      
      // Cœur de la flamme droite
      ctx.fillStyle = '#ffff00';
      ctx.beginPath();
      ctx.moveTo(x + w * 0.77, y + h * 0.9);
      ctx.lineTo(x + w * 0.83, y + h * 0.9);
      ctx.lineTo(x + w * 0.8, y + h * 0.9 + flameLength * 0.6);
      ctx.closePath();
      ctx.fill();
      
      // Réacteur central
      ctx.fillStyle = '#ff4400';
      ctx.beginPath();
      ctx.moveTo(x + w * 0.45, y + h);
      ctx.lineTo(x + w * 0.55, y + h);
      ctx.lineTo(x + w * 0.5, y + h + flameLength * 0.8);
      ctx.closePath();
      ctx.fill();
      
      // Détails des ailes
      ctx.fillStyle = '#0066aa';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.moveTo(x + w * 0.9, y + h * 0.8);
      ctx.lineTo(x + w * 1.1, y + h * 1.1);
      ctx.lineTo(x + w * 0.95, y + h * 0.95);
      ctx.closePath();
      ctx.fill();
      
      ctx.beginPath();
      ctx.moveTo(x + w * 0.1, y + h * 0.8);
      ctx.lineTo(x - w * 0.1, y + h * 1.1);
      ctx.lineTo(x + w * 0.05, y + h * 0.95);
      ctx.closePath();
      ctx.fill();
      
      // Lumières de position
      ctx.fillStyle = '#00ff00';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00ff00';
      ctx.beginPath();
      ctx.arc(x - w * 0.25, y + h * 1.1, w * 0.03, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = '#ff0000';
      ctx.shadowColor = '#ff0000';
      ctx.beginPath();
      ctx.arc(x + w * 1.25, y + h * 1.1, w * 0.03, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.shadowBlur = 0;
    }

    function drawEnemy(x, y, w, h, color, glow = false) {
      const scale = canvas.width / 640;
      const time = Date.now() / 200;
      const blink = Math.sin(time) > 0.95; // Clignement aléatoire
      
      if (glow) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = color;
      }
      ctx.fillStyle = color;
      ctx.beginPath();
      // Forme d'ennemi alien
      ctx.moveTo(x + w / 2, y);
      ctx.lineTo(x + w, y + h * 0.3);
      ctx.lineTo(x + w * 0.85, y + h);
      ctx.lineTo(x + w * 0.15, y + h);
      ctx.lineTo(x, y + h * 0.3);
      ctx.closePath();
      ctx.fill();
      
      // Yeux
      if (blink) {
        // Yeux fermés (lignes)
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2 * scale;
        ctx.beginPath();
        ctx.moveTo(x + w * 0.25, y + h * 0.4);
        ctx.lineTo(x + w * 0.45, y + h * 0.4);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + w * 0.55, y + h * 0.4);
        ctx.lineTo(x + w * 0.75, y + h * 0.4);
        ctx.stroke();
      } else {
        // Yeux ouverts
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x + w * 0.35, y + h * 0.4, w * 0.12, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + w * 0.65, y + h * 0.4, w * 0.12, 0, Math.PI * 2);
        ctx.fill();
        // Pupilles
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(x + w * 0.35, y + h * 0.4, w * 0.06, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + w * 0.65, y + h * 0.4, w * 0.06, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }

    function drawStars() {
      stars.forEach(star => {
        star.y += star.speed;
        if (star.y > canvas.height) {
          star.y = 0;
          star.x = Math.random() * canvas.width;
        }
        star.brightness += (Math.random() - 0.5) * 0.1;
        star.brightness = Math.max(0.3, Math.min(1, star.brightness));
        ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawText(text, x, y, size = "18px", glow = false) {
      const scale = canvas.width / 640;
      if (glow) {
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#00ffff";
      }
      ctx.fillStyle = "#9bf";
      ctx.font = `${parseFloat(size) * scale}px "Segoe UI", sans-serif`;
      ctx.fillText(text, x, y);
      ctx.shadowBlur = 0;
    }

    function drawParticles() {
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity || 0;
        p.life -= 0.015;
        if (p.life <= 0) {
          particles.splice(index, 1);
        } else {
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      });
    }

    function update() {
      if (gameOver) return;

      const scale = canvas.width / 640;
      // Physique améliorée avec accélération
      if (keys.left) player.ax = -0.5 * scale;
      else if (keys.right) player.ax = 0.5 * scale;
      else player.ax = 0;
      
      player.vx += player.ax;
      player.vx *= 0.92; // Friction
      player.x += player.vx;
      player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

      if (keys.shoot && bullets.length < 6) {
        const scale = canvas.width / 640;
        bullets.push({
          x: player.x + player.w / 2 - 3 * scale,
          y: player.y - 12 * scale,
          w: 6 * scale,
          h: 12 * scale,
          speed: 8 * scale,
          trail: []
        });
        keys.shoot = false;
      }

      bullets.forEach((bullet, index) => {
        bullet.trail.push({ x: bullet.x, y: bullet.y });
        if (bullet.trail.length > 8) bullet.trail.shift();
        bullet.y -= bullet.speed;
        if (bullet.y + bullet.h < 0) bullets.splice(index, 1);
      });

      enemies.forEach((enemy, eIndex) => {
        enemy.y += enemy.speed;
        if (enemy.y > canvas.height) {
          enemies.splice(eIndex, 1);
          score = Math.max(0, score - 5);
        }

        bullets.forEach((bullet, bIndex) => {
          if (
            bullet.x < enemy.x + enemy.w &&
            bullet.x + bullet.w > enemy.x &&
            bullet.y < enemy.y + enemy.h &&
            bullet.y + bullet.h > enemy.y
          ) {
            createParticle(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, enemy.color || "#ff6b6b");
            enemies.splice(eIndex, 1);
            bullets.splice(bIndex, 1);
            score += 10;
          }
        });

        if (
          player.x < enemy.x + enemy.w &&
          player.x + player.w > enemy.x &&
          player.y < enemy.y + enemy.h &&
          player.y + player.h > enemy.y
        ) {
          createParticle(player.x + player.w / 2, player.y + player.h / 2, "#00d4ff");
          gameOver = true;
          etatEl.textContent = "Game Over ! Clique sur Respawn pour recommencer.";
          respawnBtn.classList.remove("hidden");
        }
      });

      if (Math.random() < 0.02) createEnemy();
      scoreEl.textContent = "Score: " + score;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background avec gradient
      const gradient = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, 0,
        canvas.width / 2, canvas.height / 2, canvas.width
      );
      gradient.addColorStop(0, "rgba(20, 40, 80, 0.95)");
      gradient.addColorStop(1, "rgba(5, 13, 32, 0.98)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Dessiner les étoiles
      drawStars();

      // Dessiner les particules
      drawParticles();

      // Dessiner le vaisseau avec forme détaillée
      drawSpaceship(player.x, player.y, player.w, player.h, "#00d4ff", true);

      // Dessiner les balles avec traînées
      bullets.forEach((bullet) => {
        // Traînée
        bullet.trail.forEach((pos, i) => {
          const alpha = i / bullet.trail.length * 0.5;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = "#ffd700";
          ctx.beginPath();
          ctx.arc(pos.x + bullet.w / 2, pos.y + bullet.h / 2, bullet.w / 2 * (i / bullet.trail.length), 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
        drawRect(bullet, "#ffd700", true);
      });

      // Dessiner les ennemis avec formes détaillées
      enemies.forEach((enemy) => drawEnemy(enemy.x, enemy.y, enemy.w, enemy.h, enemy.color || "#ff6b6b", true));

      if (gameOver) {
        const scale = canvas.width / 640;
        drawText("GAME OVER", canvas.width / 2 - 110 * scale, canvas.height / 2 - 10 * scale, "42px", true);
      }
    }

    function loop() {
      update();
      draw();
      if (!gameOver) animationId = requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      startMusic();

      if (e.key === "ArrowLeft") keys.left = true;
      if (e.key === "ArrowRight") keys.right = true;
      if (e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        keys.shoot = true;
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft") keys.left = false;
      if (e.key === "ArrowRight") keys.right = false;
    });

    btnShoot.addEventListener("touchstart", (e) => { e.preventDefault(); startMusic(); keys.shoot = true; });
    btnShoot.addEventListener("touchend", (e) => { e.preventDefault(); keys.shoot = false; });
    btnShoot.addEventListener("mousedown", () => { startMusic(); keys.shoot = true; });
    btnShoot.addEventListener("mouseup", () => { keys.shoot = false; });
    btnShoot.addEventListener("mouseleave", () => { keys.shoot = false; });

    respawnBtn.addEventListener("click", () => {
      respawnBtn.blur();
      resetGame();
    });

    // Gestion du joystick tactile
    joystickBase.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startMusic();
      joystickActive = true;
      const rect = joystickBase.getBoundingClientRect();
      joystickCenterX = rect.left + rect.width / 2;
      joystickCenterY = rect.top + rect.height / 2;
    });

    joystickBase.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!joystickActive) return;

      const touch = e.touches[0];
      const deltaX = touch.clientX - joystickCenterX;
      const deltaY = touch.clientY - joystickCenterY;
      const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
      const maxDistance = 35;

      const clampedDistance = Math.min(distance, maxDistance);
      const angle = Math.atan2(deltaY, deltaX);

      const stickX = Math.cos(angle) * clampedDistance;
      const stickY = Math.sin(angle) * clampedDistance;

      joystickStick.style.transform = `translate(${stickX}px, ${stickY}px)`;

      // Déterminer la direction
      if (stickX < -10) {
        keys.left = true;
        keys.right = false;
      } else if (stickX > 10) {
        keys.right = true;
        keys.left = false;
      } else {
        keys.left = false;
        keys.right = false;
      }
    });

    joystickBase.addEventListener('touchend', (e) => {
      e.preventDefault();
      joystickActive = false;
      joystickStick.style.transform = 'translate(0, 0)';
      keys.left = false;
      keys.right = false;
    });

    resetGame();
  </script>
</body>
</html>
